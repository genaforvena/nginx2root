# Stage B wire-pure pump config (owner DM #59). Identical server shape to
# nginx-h2.conf except error_log: NOTICE level — per-frame DEBUG lines
# would write ~4.3e9 lines over a full 2^32-WU pump. The rung-3 trigger
# evidence (ASan report / SIGSEGV) lands in the worker stderr capture and
# the copied error log, not in debug traces. Run as:
#   <prefix>/sbin/nginx -p <repo>/lab/ -c conf/nginx-h2-pump.conf
worker_processes  1;
daemon            off;
error_log         logs/pump-error.log notice;
pid               logs/nginx.pid;
events {
    worker_connections  1024;
}

http {
    access_log      off;
    default_type    application/octet-stream;

    server {
        listen 127.0.0.1:8443 ssl;
        http2 on;
        ssl_certificate      ../ssl/cert.pem;
        ssl_certificate_key  ../ssl/key.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;

        location = /blob {
            root corpus;
        }
        location = /canary {
            root corpus;
        }
        location = /ping {
            return 200 "pong\n";
        }
    }
}
