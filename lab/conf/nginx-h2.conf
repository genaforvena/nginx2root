# Shared test config for both builds. Run as:
#   <prefix>/sbin/nginx -p <repo>/lab/ -c conf/nginx-h2.conf
# (prefixes differ per build; -p makes paths relative to lab/)
worker_processes  1;
daemon            off;
error_log         logs/error.log debug;
pid               logs/nginx.pid;
events {
    worker_connections  1024;
}

http {
    access_log      off;
    default_type    application/octet-stream;

    server {
        listen 127.0.0.1:8443 ssl;
        http2 on;
        ssl_certificate      ../ssl/cert.pem;
        ssl_certificate_key  ../ssl/key.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;

        location = /blob {
            root corpus;
        }
        location = /ping {
            return 200 "pong\n";
        }
    }
}
